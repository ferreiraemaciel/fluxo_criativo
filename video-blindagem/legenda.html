<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Legenda animada grande</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  /* Legenda grande, centralizada, fundo transparente, 1920x1080.
     Parâmetros: ?texto=Linha 1|Linha 2&dur=6.5&anim=1..7&size=120&cor=%23fff */
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #txt { position: relative; font-family: 'Roboto', system-ui, sans-serif; font-weight: 800; color: #fff; text-align: center; line-height: 1.06;
    letter-spacing: -0.012em; text-shadow: 0 6px 42px rgba(0,0,0,.42), 0 2px 10px rgba(0,0,0,.28); }
  .ln { display: block; white-space: nowrap; }
  .ln.mask { overflow: hidden; padding: .09em .08em; margin: -.09em 0; }
  .li { display: inline-block; }
  .w { display: inline-block; white-space: pre; margin: 0 .13em; will-change: transform, opacity, filter; }
  .c { display: inline-block; white-space: pre; will-change: transform, opacity; }
  #ring, #ring2 { position: absolute; left: 50%; top: 50%; width: 420px; height: 420px; margin: -210px 0 0 -210px; border-radius: 50%; border: 7px solid #fbbf24; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"><div id="ring"></div><div id="ring2"></div><div id="txt"></div></div>
<script>
const q = new URLSearchParams(location.search);
const TEXTO = q.get('texto') || 'Legenda';
const DUR = parseFloat(q.get('dur') || '4');
const ANIM = parseInt(q.get('anim') || '1');
const SIZE = parseFloat(q.get('size') || '120');
const COR = q.get('cor') || '#ffffff';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const easeIn = x => x * x * x;
const easeInOut = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
const easeBack = x => { const c1 = 2.2, c3 = c1 + 1; return 1 + c3*Math.pow(x - 1, 3) + c1*Math.pow(x - 1, 2); };
const $ = s => document.querySelector(s);

const txt = $('#txt'); txt.style.fontSize = SIZE + 'px'; txt.style.color = COR;
if (ANIM === 4) txt.style.textShadow = '0 0 60px rgba(251,191,36,.55), 0 6px 40px rgba(0,0,0,.45)';

const lines = TEXTO.split('|').map(s => s.trim());
const LN = [], W = [], C = [];
lines.forEach((ln, li) => {
  const d = document.createElement('div'); d.className = 'ln' + (ANIM === 1 ? ' mask' : ''); txt.appendChild(d);
  const inner = document.createElement('span'); inner.className = 'li'; d.appendChild(inner);
  ln.split(' ').forEach(word => {
    const w = document.createElement('span'); w.className = 'w'; inner.appendChild(w);
    if (ANIM === 5) {
      [...word].forEach(ch => { const c = document.createElement('span'); c.className = 'c'; c.textContent = ch; w.appendChild(c); C.push(c); });
    } else w.textContent = word;
    W.push({ el: w, line: li });
  });
  LN.push({ el: d, inner });
});

function st(el, o = 1, x = 0, y = 0, s = 1, r = 0, b = 0) {
  el.style.opacity = o;
  el.style.transform = `translate(${x}px, ${y}px) scale(${s}) rotate(${r}deg)`;
  el.style.filter = b > .05 ? `blur(${b}px)` : 'none';
}

function render(t) {
  const D = DUR;
  if (ANIM === 1) {                       // máscara: cada linha sobe de dentro de uma janela
    LN.forEach((l, i) => {
      const a = clamp((t - .12*i)/.7), b = clamp((t - (D - .6) - .1*i)/.5);
      const y = (1 - easeExpo(a))*112 - easeIn(b)*112;
      l.inner.style.transform = `translateY(${y}%)`;
    });
  } else if (ANIM === 2) {                // palavras saltam com elasticidade
    W.forEach((w, i) => {
      const a = clamp((t - .1*i)/.5), b = clamp((t - (D - .32))/.3);
      st(w.el, clamp(a*3)*(1 - b*b), 0, (1 - easeOut(a))*46 - b*22, (.45 + .55*easeBack(a))*(1 - .22*easeIn(b)));
    });
  } else if (ANIM === 3) {                // desliza da direita com borrão de movimento e sai pela esquerda
    const a = clamp(t/.75), b = clamp((t - (D - .65))/.6);
    const x = (1 - easeExpo(a))*1100 - easeIn(b)*1100;
    const bl = (1 - easeExpo(a))*20 + easeIn(b)*20;
    st(txt, clamp(a*3)*(1 - b*.15), x, 0, 1 + ((1 - easeExpo(a)) + easeIn(b))*.10, 0, bl);
  } else if (ANIM === 4) {                // impacto: entra grande e borrado, encaixa, brilha, anéis
    const a = clamp(t/.38), b = clamp((t - (D - .55))/.5);
    const shake = Math.sin(t*95)*(1 - a)*(t < .35 ? 9 : 0);
    st(txt, clamp(a*4)*(1 - b), shake, 0, (2.0 - easeExpo(a))*(1 + .55*easeIn(b)), 0, (1 - easeExpo(a))*22 + b*14);
    txt.style.letterSpacing = (-0.012 + b*.22) + 'em';
    [['#ring', 0], ['#ring2', .14]].forEach(([id, d]) => {
      const k = clamp((t - d)/.75); const el = $(id);
      el.style.opacity = k > 0 && k < 1 ? .6*(1 - k) : 0;
      el.style.transform = `scale(${.25 + 3.4*easeExpo(k)})`;
    });
  } else if (ANIM === 5) {                // letra por letra, em cascata; sai caindo na ordem inversa
    const n = C.length;
    C.forEach((c, i) => {
      const a = clamp((t - .022*i)/.42), b = clamp((t - (D - .6) - .016*(n - 1 - i))/.38);
      st(c, easeOut(a)*(1 - b), 0, (1 - easeOut(a))*70 + easeIn(b)*70, 1, (1 - easeOut(a))*9 + b*6);
    });
  } else if (ANIM === 6) {                // carimbo: cada palavra bate na tela
    W.forEach((w, i) => {
      const a = clamp((t - .36*i)/.3), b = clamp((t - (D - .65))/.6);
      const k = easeOut(a);
      st(w.el, clamp(a*5)*(1 - b), 0, -34*b, 1.55 - .55*k + Math.sin(a*Math.PI)*.0, (1 - k)*-5, (1 - k)*9 + b*11);
    });
    const kick = Math.max(0, 1 - ((t % .36)/.09)); // pequeno tremor a cada batida
    txt.style.transform = `translateY(${W.some((w, i) => t > .36*i + .06 && t < .36*i + .16) ? 4 : 0}px)`;
  } else if (ANIM === 7) {                // abre o espaçamento e foca; respira; sobe e dissolve
    const b = clamp((t - (D - .75))/.7);
    txt.style.letterSpacing = (-0.012 + (1 - easeExpo(clamp(t/1.2)))*.32) + 'em';
    const drift = 1 + .04*clamp(t/D);
    LN.forEach((l, i) => {
      const a = clamp((t - .16*i)/1.1);
      st(l.el, clamp(a*2.2)*(1 - easeIn(b)), 0, -46*easeInOut(b), (.95 + .05*easeOut(a))*drift, 0, (1 - easeOut(a))*16 + easeIn(b)*16);
    });
  }
}

window.__DUR = DUR;
window.__seek = t => render(clamp(t, 0, DUR));
window.__ready = document.fonts.load('800 100px Roboto').then(() => document.fonts.ready).then(() => {
  // reduz o corpo se a linha passar de 1720 px
  let s = SIZE; while (txt.scrollWidth > 1720 && s > 60) { s -= 4; txt.style.fontSize = s + 'px'; }
  render(0); return new Promise(r => setTimeout(r, 80));
});
</script>
</body>
</html>
