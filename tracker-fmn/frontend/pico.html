<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pico de Vendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0d; --surface:#131316; --surface-2:#1a1a1f; --border:#26262c;
    --t1:#f2f2f3; --t2:#a9a9b2; --t3:#6b6b76; --gold:#eaaa41;
    --ok:#4ade80; --azul:#38bdf8; --lilas:#a78bfa; --amb:#fbbf24;
    --verm:#f87171; --laranja:#fb923c; --cinza:#94a3b8; --verde2:#4ade80;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--t1);font-family:Roboto,sans-serif;
    font-size:14px;line-height:1.5;padding:22px 18px 60px}
  .wrap{max-width:1080px;margin:0 auto}
  .topo{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:19px;font-weight:700}
  .tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:6px;
    background:rgba(234,170,65,.12);color:var(--gold);border:1px solid rgba(234,170,65,.3)}
  .sub{font-size:12.5px;color:var(--t3);margin-bottom:20px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:14px 16px;margin-bottom:14px}
  .card h2{font-size:13px;font-weight:700;margin-bottom:11px;display:flex;
    align-items:center;gap:8px;flex-wrap:wrap}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:9px}
  .kpi{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:9px 11px}
  .kpi .lb{font-size:10px;color:var(--t3);margin-bottom:2px}
  .kpi .vl{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .dec{padding:9px 11px;border-radius:8px;margin-bottom:8px;
    background:var(--surface-2);border:1px solid var(--border)}
  .dec .q{font-size:12.5px;font-weight:700;margin-bottom:4px}
  .dec .e{font-size:12px;font-weight:700;color:var(--ok)}
  .dec .p{font-size:12px;color:var(--amb)}
  .dec .r{font-size:11px;color:var(--t3);font-style:italic;margin-top:3px}
  details{background:var(--surface);border:1px solid var(--border);
    border-radius:12px;margin-bottom:10px;overflow:hidden}
  summary{padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;
    list-style:none;user-select:none}
  summary::-webkit-details-marker{display:none}
  .dot{width:8px;height:8px;border-radius:99px;flex-shrink:0}
  .nome{font-size:13px;font-weight:700;flex-shrink:0}
  .cresce{flex:1}
  .pct{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
  .frac{font-size:11.5px;color:var(--t3);font-variant-numeric:tabular-nums;min-width:46px;text-align:right}
  .barra{width:88px;height:5px;border-radius:99px;background:rgba(255,255,255,.07);
    overflow:hidden;flex-shrink:0}
  .barra i{display:block;height:100%;border-radius:99px}
  .lista{padding:0 14px 12px}
  .tar{display:flex;align-items:flex-start;gap:9px;padding:7px 0;
    border-top:1px solid var(--border)}
  .chk{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--border);
    flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;
    font-size:10px;color:var(--bg)}
  .chk.on{background:var(--ok);border-color:var(--ok)}
  .tar .tt{font-size:12.5px;font-weight:600}
  .tar .cc{font-size:11px;color:var(--t3);margin-top:1px}
  .tar.feita .tt{color:var(--t3);text-decoration:line-through}
  .meta{display:flex;align-items:center;gap:8px;flex-shrink:0;font-size:11px;
    color:var(--t3);font-variant-numeric:tabular-nums}
  .d{font-weight:700;min-width:34px;text-align:right}
  .dt{min-width:52px;text-align:right}
  .defs{margin:5px 0 2px 25px;padding:8px 10px;border-radius:7px;
    background:rgba(74,222,128,.05);border:1px solid rgba(74,222,128,.16);
    display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:7px}
  .defs div{font-size:11.5px}
  .defs .k{color:var(--t3);font-size:10px}
  .defs .v{color:var(--t1);font-weight:600}
  .rod{font-size:11px;color:var(--t3);text-align:center;margin-top:26px;line-height:1.7}
  .erro{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);
    border-radius:10px;padding:18px;text-align:center;font-size:13px}
  table{width:100%;border-collapse:collapse}
  th{font-size:10px;color:var(--t3);font-weight:700;text-transform:uppercase;
    letter-spacing:.3px;padding:5px 8px;text-align:right}
  th:first-child{text-align:left}
  td{padding:5px 8px;font-size:12px;text-align:right;font-variant-numeric:tabular-nums;
    border-top:1px solid var(--border)}
  td:first-child{text-align:left;color:var(--t2)}
  .forte{font-weight:700;color:var(--t1)}
  .verde{color:var(--ok);font-weight:700}
  .fase{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
    padding:7px 9px}
  .fase .n{font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:6px}
  .fase .v{font-size:11.5px;color:var(--t3);display:flex;justify-content:space-between;
    gap:6px;margin-top:3px;font-variant-numeric:tabular-nums}
  .fase .o{font-size:10px;color:var(--t3);opacity:.7;margin-top:2px}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:7px}
  .prog{height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;
    margin:10px 0}
  .prog i{display:block;height:100%;border-radius:99px}
  .perg{margin-bottom:9px}
  .perg .q2{font-size:12px;font-weight:600;color:var(--t2);margin-bottom:2px}
  .perg .a{font-size:12px;color:var(--t1);background:var(--surface-2);
    border:1px solid var(--border);border-radius:7px;padding:6px 9px;white-space:pre-wrap}
  .perg .vazio{font-size:11.5px;color:var(--t3);font-style:italic}
  .exp{font-size:11px;color:var(--t3);line-height:1.5;margin-top:5px;
    padding:6px 9px;border-radius:6px;background:rgba(56,189,248,.06);
    border:1px solid rgba(56,189,248,.16)}
  .anun{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:11.5px;
    border-top:1px solid var(--border)}
  .card > h2.rec{cursor:pointer;user-select:none}
  .card > h2.rec::before{content:'▾';color:var(--t3);font-size:12px;width:10px;display:inline-block}
  .card.fechado > h2.rec::before{content:'▸'}
  .card.fechado > h2{margin-bottom:0}
  .card.fechado > :not(h2){display:none}
  .ficha-g{font-size:10.5px;font-weight:700;color:var(--t2);letter-spacing:.4px;
    text-transform:uppercase;margin:12px 0 7px;padding-bottom:4px;border-bottom:1px solid var(--border)}
  .ficha-g:first-of-type{margin-top:0}
  .ficha{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:9px}
  .ficha .k{font-size:10.5px;color:var(--t3)}
  .ficha .v{font-size:12.5px;color:var(--t1);font-weight:600;white-space:pre-wrap;word-break:break-word}
  .ficha .v a{color:var(--azul);text-decoration:none}
  .ficha .largo{grid-column:1/-1}
  .refs{margin:4px 0 2px 25px;display:flex;flex-direction:column;gap:3px}
  .refs a{font-size:11.5px;color:var(--azul);text-decoration:none}
  .refs a::before{content:'↗ ';opacity:.6}
  .refs a span{color:var(--t3)}
  @media(max-width:640px){
    .barra{display:none} .tar .cc{display:none} h1{font-size:16px}
  }

  /* ── Abas Pico | Tráfego e a leitura do Tráfego (10/09/2026) ── */
  .abas{display:flex;gap:6px;margin-bottom:16px}
  .abas button{font:700 12.5px Roboto,sans-serif;padding:7px 14px;border-radius:8px;cursor:pointer;
    background:var(--surface);color:var(--t2);border:1px solid var(--border)}
  .abas button.on{background:rgba(234,170,65,.12);color:var(--gold);border-color:rgba(234,170,65,.35)}
  .abas button:focus-visible,.per button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .per{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
  .per button{font:700 11.5px Roboto,sans-serif;padding:5px 11px;border-radius:7px;cursor:pointer;
    background:transparent;color:var(--t3);border:1px solid var(--border)}
  .per button.on{color:var(--t1);background:var(--surface-2)}
  .trf{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px}
  .trf table{min-width:1180px}
  .trf th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);font-weight:700;
    padding:9px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border);
    position:sticky;top:0;background:var(--surface)}
  .trf th:first-child,.trf td:first-child{text-align:left}
  .trf td{white-space:nowrap;border-bottom:1px solid var(--border);padding:7px 8px}
  .trf tr.camp td{font-weight:700;background:rgba(255,255,255,.02)}
  .trf tr.conj td:first-child{padding-left:22px;color:var(--t2)}
  .trf tr.ad td:first-child{padding-left:36px}
  .nome-ad{display:flex;align-items:center;gap:8px;max-width:330px}
  .mini{position:relative;width:30px;height:30px;border-radius:4px;flex-shrink:0;overflow:hidden;
    border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04)}
  .mini img{width:100%;height:100%;object-fit:cover;display:block}
  .mini .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.35);color:#fff;font-size:10px}
  .num-ad{font-size:10px;font-weight:900;color:var(--gold)}
  .tit-ad{overflow:hidden;text-overflow:ellipsis;font-size:12px}
  .bom{color:var(--ok)} .ruim{color:var(--verm)}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="sub">Carregando</div>
</div>

<script>
const FASES = [
  ['organizar','Organizar','#94a3b8'], ['antecipacao','Antecipação','#38bdf8'],
  ['captacao','Captação','#a78bfa'], ['aquecimento','Aquecimento','#fbbf24'],
  ['grande_dia','Grande Dia','#f87171'], ['carrinho_aberto','Carrinho aberto','#4ade80'],
  ['encerramento','Encerramento','#fb923c'], ['pos','Pós','#64748b'],
];
const TRILHAS = { oferta:'Oferta', conteudo:'Conteúdo', trafego:'Tráfego',
  comercial:'Comercial', paginas:'Páginas', mentoria:'Mentoria', debriefing:'Debriefing' };

const brl = v => (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc = t => String(t ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtD = iso => { if(!iso) return ''; const [,m,d]=iso.split('-'); return d+'/'+m; };
const semana = iso => { if(!iso) return '';
  return ['dom','seg','ter','qua','qui','sex','sáb'][new Date(iso+'T12:00:00').getDay()]; };
const rotD = o => o===0 ? 'D0' : (o<0 ? 'D'+o : 'D+'+o);

/* Fórmula do plano de mídia, igual à do Tracker: o remarketing sobe
   conforme os dias e a captação é o que sobra. */
/* Rateio das 6 campanhas de lembrete, do slide do retiro. */
const RATEIO_LEMB = [
  ['Faltam 7 dias', .07], ['Faltam 5 dias', .10], ['Faltam 3 dias', .15],
  ['É amanhã', .15],      ['É hoje', .25],        ['Estamos ao vivo', .28],
];

const pctRmk = d => Math.min(.41, Math.max(.275, .275 + ((Number(d)||7)-7)/13*(.41-.275)));

/* Registro copiado de app/pico.jsx. Mudou lá, trazer para cá. */
const VINCULOS = {
  nome_campanha:        { grupo:'Campanha', label:'Nome da campanha', tipo:'texto' },
  mote:                 { grupo:'Campanha', label:'Mote', tipo:'texto' },
  mote_onde:            { grupo:'Campanha', label:'Onde o mote aparece', tipo:'texto_longo' },
  promessa:             { grupo:'Campanha', label:'Promessa da condição', tipo:'texto_longo' },
  inimigo:              { grupo:'Campanha', label:'Inimigo (o cenário)', tipo:'texto' },
  palavra_chave:        { grupo:'Campanha', label:'Palavra do "comente a palavra"', tipo:'texto' },
  objeto_antecipacao:   { grupo:'Campanha', label:'Objeto físico de antecipação', tipo:'texto' },
  produto:              { grupo:'Oferta', label:'Produto ou combo', tipo:'texto' },
  preco_normal:         { grupo:'Oferta', label:'Preço fora do pico', tipo:'moeda' },
  preco_pico:           { grupo:'Oferta', label:'Preço no pico', tipo:'moeda', alimenta:'projeto.ticket' },
  desconto_pct:         { grupo:'Oferta', label:'Desconto', tipo:'percent' },
  publico_sensivel:     { grupo:'Oferta', label:'Público sensível a preço', tipo:'opcao', opcoes:['Sim','Não'] },
  combo_itens:          { grupo:'Oferta', label:'Itens do combo', tipo:'lista' },
  bonus_velocidade:     { grupo:'Oferta', label:'Bônus por velocidade', tipo:'lista' },
  regra_credito:        { grupo:'Oferta', label:'Regra para quem já comprou', tipo:'texto_longo' },
  preco_aluno:          { grupo:'Oferta', label:'Preço para quem já é aluno', tipo:'moeda' },
  item_fisico:          { grupo:'Prêmios e bônus', label:'Item físico', tipo:'texto' },
  sorteio:              { grupo:'Prêmios e bônus', label:'Sorteio', tipo:'texto' },
  premio_primeira_compra:{ grupo:'Prêmios e bônus', label:'Prêmio da primeira compra', tipo:'texto' },
  bonus_relampago:      { grupo:'Prêmios e bônus', label:'Bônus relâmpago', tipo:'texto' },
  bonus_final:          { grupo:'Prêmios e bônus', label:'Bônus guardado para o fim', tipo:'texto' },
  sorteio_final:        { grupo:'Prêmios e bônus', label:'Sorteio da última hora', tipo:'texto' },
  mentoria_formato:     { grupo:'Mentoria', label:'Formato', tipo:'opcao', opcoes:['Degustação','Produto completo'] },
  mentoria_encontros:   { grupo:'Mentoria', label:'Quantos encontros', tipo:'numero' },
  mentoria_duracao:     { grupo:'Mentoria', label:'Duração de cada um', tipo:'texto' },
  mentoria_preco:       { grupo:'Mentoria', label:'Preço cheio', tipo:'moeda' },
  mentoria_vagas:       { grupo:'Mentoria', label:'Teto de vagas', tipo:'numero' },
  mentoria_local:       { grupo:'Mentoria', label:'Onde acontece', tipo:'opcao', opcoes:['Zoom','Google Meet','Presencial','Área de membros'] },
  mentoria_calendario:  { grupo:'Mentoria', label:'Datas dos encontros', tipo:'texto_longo' },
  mentoria_plano:       { grupo:'Mentoria', label:'Plano de ação do mentorado', tipo:'texto_longo' },
  mentoria_na_oferta:   { grupo:'Mentoria', label:'Como aparece na oferta', tipo:'texto_longo' },
  aula1_tema:           { grupo:'Aulas de aquecimento', label:'Tema da aula 1', tipo:'texto' },
  aula2_tema:           { grupo:'Aulas de aquecimento', label:'Tema da aula 2', tipo:'texto' },
  aula3_tema:           { grupo:'Aulas de aquecimento', label:'Tema da aula 3', tipo:'texto' },
  data_anuncios:        { grupo:'Operação', label:'Entrega dos anúncios', tipo:'data' },
  data_paginas:         { grupo:'Operação', label:'Entrega das páginas', tipo:'data' },
  responsavel_producao: { grupo:'Operação', label:'Quem produz', tipo:'texto' },
  cadencia_follow:      { grupo:'Operação', label:'Cadência de follow', tipo:'texto_longo' },
  templates_aprovados:  { grupo:'Operação', label:'Templates aprovados', tipo:'texto_longo' },
  pagina_captura:       { grupo:'Links', label:'Página de captura', tipo:'link' },
  pagina_obrigado:      { grupo:'Links', label:'Página de obrigado', tipo:'link' },
  pagina_venda:         { grupo:'Links', label:'Página de venda', tipo:'link' },
  checkout:             { grupo:'Links', label:'Checkout', tipo:'link' },
  grupo_whatsapp:       { grupo:'Links', label:'Grupo de WhatsApp', tipo:'link' },
  link_encontros:       { grupo:'Links', label:'Sala dos encontros', tipo:'link' },
  manifesto_link:       { grupo:'Links', label:'Roteiro da narrativa', tipo:'link' },
  trailer_link_1:       { grupo:'Links', label:'Trailer 1', tipo:'link' },
  trailer_link_2:       { grupo:'Links', label:'Trailer 2', tipo:'link' },
  pasta_depoimentos:    { grupo:'Links', label:'Depoimentos por objeção', tipo:'link' },
  doc_objecoes:         { grupo:'Links', label:'Doc de dúvidas e objeções', tipo:'link' },
};
const GRUPOS_FICHA = ['Campanha','Oferta','Prêmios e bônus','Mentoria',
  'Aulas de aquecimento','Operação','Links'];

const vazio = v => v == null || v === '' || (Array.isArray(v) && v.length === 0);

function defsEfetivas(t, projeto) {
  const campos = Array.isArray(t.campos) ? t.campos : [];
  if (!campos.length || !projeto) return t.definicoes || {};
  const dec = projeto.declaracoes || {}, pm = projeto.plano_midia || {};
  const out = { ...(t.definicoes || {}) };
  campos.forEach(c => {
    if (c.vinculo && !vazio(dec[c.vinculo])) { out[c.chave] = dec[c.vinculo]; return; }
    if (c.alimenta) {
      const [onde, k] = c.alimenta.split('.');
      const v = onde === 'plano' ? pm[k] : onde === 'projeto' ? projeto[k] : undefined;
      if (!vazio(v)) out[c.chave] = v;
    }
  });
  return out;
}


function render(d) {
  const p = d.projeto, pm = p.plano_midia || {};
  const feitas = d.tarefas.filter(t => t.status==='feito').length;
  const rmk = pctRmk(pm.dias_remarketing);
  const capt = 1 - (Number(pm.pct_teaser)||0) - (Number(pm.pct_aquecimento)||0) - rmk;
  const leads = Number(pm.taxa_conversao) > 0
    ? Math.ceil((Number(pm.vendas_meta)||0)/Number(pm.taxa_conversao)) : 0;
  const midia = capt > 0 ? (leads*(Number(pm.cpl_meta)||0))/capt : 0;
  const hoje = new Date().toISOString().slice(0,10);
  const dias = p.data_abertura
    ? Math.round((new Date(p.data_abertura+'T12:00:00') - new Date(hoje+'T12:00:00'))/864e5)
    : null;

  let h = `<div class="topo"><h1>${esc(p.nome)}</h1>
    <span class="tag">somente leitura</span></div>
    <div class="sub">Abre em ${p.data_abertura ? fmtD(p.data_abertura)+'/'+p.data_abertura.slice(0,4) : 'data a definir'}${
      dias !== null ? (dias > 0 ? ' · faltam '+dias+' dias' : dias === 0 ? ' · é hoje' : ' · carrinho aberto há '+Math.abs(dias)+' dias') : ''}</div>`;

  h += `<div class="card"><h2>Onde está</h2><div class="kpis">
    <div class="kpi"><div class="lb">Tarefas</div><div class="vl">${feitas}/${d.tarefas.length}</div></div>
    <div class="kpi"><div class="lb">Progresso</div><div class="vl" style="color:var(--ok)">${
      d.tarefas.length ? Math.round(feitas/d.tarefas.length*100) : 0}%</div></div>
    <div class="kpi"><div class="lb">Leads na meta</div><div class="vl">${leads ? leads.toLocaleString('pt-BR') : '—'}</div></div>
    <div class="kpi"><div class="lb">Verba planejada</div><div class="vl">${midia ? brl(midia) : '—'}</div></div>
    <div class="kpi"><div class="lb">Gasto até agora</div><div class="vl" style="color:var(--azul)">${brl(d.gasto)}</div></div>
    <div class="kpi"><div class="lb">Anúncios do pico</div><div class="vl">${d.anuncios}</div></div>
  </div></div>`;

  // ── Ficha da campanha ───────────────────────────────────────
  const dec = p.declaracoes || {};
  const fmtDec = (c, v) => {
    if (c.tipo === 'moeda') return brl(v);
    if (c.tipo === 'percent') return (Number(v)*100).toFixed(1).replace('.0','') + '%';
    if (c.tipo === 'data') return v.split('-').reverse().join('/');
    if (c.tipo === 'lista') return v.map(i => esc(i.nome) + (i.valor ? ' (' + brl(i.valor) + ')' : '')).join('<br>')
      + '<br><b>Total ' + brl(v.reduce((a,i)=>a+(Number(i.valor)||0),0)) + '</b>';
    if (c.tipo === 'link') return `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>`;
    return esc(v);
  };
  const gruposF = [...new Set(Object.values(VINCULOS).map(c => c.grupo))];
  const cheiosF = Object.keys(VINCULOS).filter(k => !vazio(dec[k]));
  if (cheiosF.length) {
    h += `<div class="card"><h2>Ficha da campanha</h2>`;
    gruposF.forEach(g => {
      const ks = cheiosF.filter(k => VINCULOS[k].grupo === g);
      if (!ks.length) return;
      h += `<div class="ficha-g">${g}</div><div class="ficha">` + ks.map(k => {
        const c = VINCULOS[k];
        const largo = c.tipo === 'texto_longo' || c.tipo === 'lista';
        return `<div${largo ? ' class="largo"' : ''}><div class="k">${esc(c.label)}</div>
          <div class="v">${fmtDec(c, dec[k])}</div></div>`;
      }).join('') + `</div>`;
    });
    h += `</div>`;
  }

  // ── Imaginação primária ─────────────────────────────────────
  const met = (mo, ce, ind) => {
    const m = (d.metricas||[]).find(x => x.momento===mo && x.cenario===ce && x.indicador===ind);
    return m && m.valor != null ? Number(m.valor) : null;
  };
  const CEN = ['conservador','alvo','otimista'];
  const temImag = CEN.some(c => ['vendas','ticket','investimento'].some(i => met('imaginacao',c,i) != null));
  if (temImag) {
    h += `<div class="card"><h2>Imaginação primária</h2><table><thead><tr><th></th>` +
      CEN.map(c => `<th style="text-transform:capitalize">${c}</th>`).join('') + `</tr></thead><tbody>`;
    [['vendas','Quantidade de vendas','un'],['ticket','Ticket médio','R$'],
     ['investimento','Investimento','R$']].forEach(([k,lb,u]) => {
      h += `<tr><td>${lb}</td>` + CEN.map(c => {
        const v = met('imaginacao',c,k);
        return `<td>${v==null?'—':(u==='R$'?brl(v):Math.round(v).toLocaleString('pt-BR'))}</td>`;
      }).join('') + `</tr>`;
    });
    h += `<tr><td class="forte">Faturamento</td>` + CEN.map(c => {
      const f = (met('imaginacao',c,'vendas')||0) * (met('imaginacao',c,'ticket')||0);
      return `<td class="verde">${brl(f)}</td>`;
    }).join('') + `</tr>`;
    h += `<tr><td>ROAS</td>` + CEN.map(c => {
      const f = (met('imaginacao',c,'vendas')||0) * (met('imaginacao',c,'ticket')||0);
      const i = met('imaginacao',c,'investimento')||0;
      return `<td>${i>0?(f/i).toFixed(2):'—'}</td>`;
    }).join('') + `</tr></tbody></table></div>`;
  }

  // ── Plano de mídia ──────────────────────────────────────────
  if (midia > 0) {
    const imp = Number(pm.imposto_meta)||0;
    const fases = [
      ['Teaser', Number(pm.pct_teaser)||0, pm.dias_teaser, '#38bdf8', 'Engajamento, 1-3-3, ABO'],
      ['Captura de Leads', capt, pm.dias_captacao, '#a78bfa', 'Leads, CBO, 4 conjuntos'],
      ['Aquecimento', Number(pm.pct_aquecimento)||0, pm.dias_aquecimento, '#fbbf24', 'Relacionamento e lembrete, 50/50'],
      ['Remarketing', rmk, pm.dias_remarketing, '#4ade80', 'Vendas, evento Compra, CBO'],
    ];
    h += `<div class="card"><h2>Plano de mídia</h2>
      <div class="kpis" style="margin-bottom:12px">
        <div class="kpi"><div class="lb">Leads necessários</div><div class="vl">${leads?leads.toLocaleString('pt-BR'):'—'}</div></div>
        <div class="kpi"><div class="lb">Investimento em mídia</div><div class="vl">${brl(midia)}</div></div>
        <div class="kpi"><div class="lb">Imposto do Meta</div><div class="vl">${brl(midia*imp)}</div></div>
        <div class="kpi"><div class="lb">Investimento total</div><div class="vl" style="color:var(--ok)">${brl(midia*(1+imp))}</div></div>
        <div class="kpi"><div class="lb">CPL na meta</div><div class="vl">${pm.cpl_meta?brl(pm.cpl_meta):'—'}</div></div>
        <div class="kpi"><div class="lb">Conversão</div><div class="vl">${pm.taxa_conversao?(Number(pm.taxa_conversao)*100).toFixed(1).replace('.0','')+'%':'—'}</div></div>
      </div>
      <div class="grid3">` +
      fases.map(([nm,pc,di,co,ob]) => `<div class="fase">
        <div class="n"><span class="dot" style="background:${co}"></span>${nm}
          <span style="margin-left:auto;color:var(--t3);font-weight:700">${(pc*100).toFixed(1)}%</span></div>
        <div class="v"><span>${brl(midia*pc)}</span><span>${di?brl(midia*pc/Number(di))+' por dia':''}</span></div>
        <div class="o">${ob}</div></div>`).join('') +
      `</div>
      <div style="font-size:10.5px;color:var(--t3);margin-top:9px;line-height:1.45">
        Teaser e aquecimento têm percentual fixo, o remarketing sobe conforme os dias,
        e a captação é o que sobra. Fórmula da planilha do retiro.</div>`;
    const vLemb = midia * (Number(pm.pct_aquecimento)||0) * .5;
    if (vLemb > 0) {
      h += `<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
        <div style="font-size:10.5px;font-weight:700;color:var(--t3);letter-spacing:.4px;
          text-transform:uppercase;margin-bottom:7px">As 6 campanhas de lembrete, com orçamento total</div>
        <div class="grid3">` +
        RATEIO_LEMB.map(([nm,pc]) => `<div class="fase">
          <div class="n">${nm}</div>
          <div class="v"><span class="forte">${brl(vLemb*pc)}</span><span>${(pc*100).toFixed(0)}%</span></div>
        </div>`).join('') + `</div></div>`;
    }
    h += `</div>`;
  }

  // ── Plano contra o real ─────────────────────────────────────
  if (d.anuncios > 0) {
    const consumo = midia > 0 ? d.gasto/midia*100 : null;
    const cpa = d.compras > 0 ? d.gasto/d.compras : null;
    h += `<div class="card"><h2>Plano contra o real</h2>
      <div class="kpis">
        <div class="kpi"><div class="lb">Verba planejada</div><div class="vl">${brl(midia)}</div></div>
        <div class="kpi"><div class="lb">Gasto real</div><div class="vl" style="color:var(--azul)">${brl(d.gasto)}</div></div>
        <div class="kpi"><div class="lb">Consumo</div><div class="vl" style="color:${consumo>100?'var(--verm)':'var(--ok)'}">${consumo==null?'—':consumo.toFixed(0)+'%'}</div></div>
        <div class="kpi"><div class="lb">Vendas no Meta</div><div class="vl">${d.compras}</div></div>
        <div class="kpi"><div class="lb">CPA real</div><div class="vl">${cpa?brl(cpa):'—'}</div></div>
      </div>` +
      (consumo!=null ? `<div class="prog"><i style="width:${Math.min(100,consumo)}%;background:${consumo>100?'var(--verm)':'var(--azul)'}"></i></div>` : '') +
      (d.porAnuncio||[]).map(a => `<div class="anun">
        <span style="color:var(--t3);font-weight:700;min-width:52px">ADS ${String(a.numero).padStart(3,'0')}</span>
        <span class="cresce" style="color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.titulo)}</span>
        <span style="color:var(--t3);min-width:38px;text-align:right">${a.compras} ${a.compras===1?'venda':'vendas'}</span>
        <span class="forte" style="min-width:86px;text-align:right">${brl(a.gasto)}</span>
      </div>`).join('') +
      `</div>`;
  }

  if (d.decisoes.length) {
    h += `<div class="card"><h2>Decisões</h2>`;
    d.decisoes.forEach(x => {
      h += `<div class="dec"><div class="q">${esc(x.pergunta)}</div>` +
        (x.escolha ? `<div class="e">✓ ${esc(x.escolha)}</div>`
                   : `<div class="p">ainda não decidido</div>`) +
        (x.regra ? `<div class="r">${esc(x.regra)}</div>` : '') +
        (x.escolha && x.explicacoes && x.explicacoes[x.escolha]
          ? `<div class="exp">${esc(x.explicacoes[x.escolha])}</div>` : '') + `</div>`;
    });
    h += `</div>`;
  }

  FASES.forEach(([id, nome, cor]) => {
    const lista = d.tarefas.filter(t => t.fase === id);
    if (!lista.length) return;
    const f = lista.filter(t => t.status==='feito').length;
    const pct = Math.round(f/lista.length*100);
    const completo = f === lista.length;
    h += `<details${completo ? '' : ' open'}><summary>
      <span class="dot" style="background:${cor}"></span>
      <span class="nome">${nome}</span>${completo ? ' <span style="color:var(--ok)">✓</span>' : ''}
      <span class="cresce"></span>
      <span class="pct" style="color:${completo?'var(--ok)':'var(--t2)'}">${pct}%</span>
      <span class="frac">${f}/${lista.length}</span>
      <span class="barra"><i style="width:${pct}%;background:${cor}"></i></span>
    </summary><div class="lista">`;

    lista.forEach(t => {
      const ok = t.status === 'feito';
      h += `<div class="tar${ok?' feita':''}">
        <span class="chk${ok?' on':''}">${ok?'✓':''}</span>
        <span class="cresce"><span class="tt">${esc(t.titulo)}</span>
          <span style="font-size:10px;color:var(--t3);margin-left:6px">${TRILHAS[t.trilha]||''}</span>
          ${t.criterio_pronto ? `<div class="cc">${esc(t.criterio_pronto)}</div>` : ''}</span>
        <span class="meta"><span class="d">${rotD(t.offset_dias)}</span>
          <span class="dt">${t.data_prevista ? fmtD(t.data_prevista)+' '+semana(t.data_prevista) : ''}</span></span>
      </div>`;
      // Referências do retiro para a tarefa
      const refs = Array.isArray(t.referencias) ? t.referencias : [];
      if (refs.length) {
        h += `<div class="refs">` + refs.map(r =>
          `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.titulo)}${r.nota ? ' <span>· '+esc(r.nota)+'</span>' : ''}</a>`
        ).join('') + `</div>`;
      }
      // O que foi definido na tarefa, quando houver
      const defs = defsEfetivas(t, p);
      const campos = Array.isArray(t.campos) ? t.campos : [];
      const cheios = campos.filter(c => {
        const v = defs[c.chave];
        return v != null && v !== '' && !(Array.isArray(v) && !v.length);
      });
      if (cheios.length) {
        h += `<div class="defs">`;
        cheios.forEach(c => {
          let v = defs[c.chave];
          if (c.tipo === 'moeda') v = brl(v);
          else if (c.tipo === 'percent') v = (Number(v)*100).toFixed(1).replace('.0','')+'%';
          else if (Array.isArray(v)) v = v.map(i => i.nome + (i.valor ? ' ('+brl(i.valor)+')' : '')).join(', ');
          else if (c.tipo === 'data') v = String(v).split('-').reverse().join('/');
          h += `<div><div class="k">${esc(c.label)}</div><div class="v">${esc(v)}</div></div>`;
        });
        h += `</div>`;
      }
    });
    h += `</div></details>`;
  });

  // ── Debriefing ──────────────────────────────────────────────
  const rd = (() => { try { return JSON.parse(p.observacoes||'{}').debrief||[]; } catch { return []; } })();
  const IND = [['faturamento','Faturamento','R$'],['vendas','Vendas','un'],
    ['ticket_medio','Ticket médio','R$'],['leads_grupo','Leads no grupo','un'],
    ['verba','Verba investida','R$'],['cpl','CPL','R$'],['cac','CAC','R$'],
    ['roas','ROAS','x'],['conv_grupo','Conversão do grupo','%']];
  const dbg = (mo,k) => met(mo,null,k);
  const deriv = (k,fn) => {
    const f=fn('faturamento')||0, v=fn('vendas')||0, vb=fn('verba')||0, lg=fn('leads_grupo')||0;
    if(k==='ticket_medio') return v>0?f/v:null;
    if(k==='cpl') return lg>0?vb/lg:null;
    if(k==='cac') return v>0?vb/v:null;
    if(k==='roas') return vb>0?f/vb:null;
    if(k==='conv_grupo') return lg>0?v/lg*100:null;
    return null;
  };
  const temDebrief = IND.some(([k]) => dbg('debriefing',k)!=null) || rd.some(x=>x&&x.trim());
  if (temDebrief) {
    h += `<div class="card"><h2>Debriefing</h2><table><thead><tr>
      <th>Indicador</th><th>Meta</th><th>Realizado</th></tr></thead><tbody>`;
    IND.forEach(([k,lb,u]) => {
      const calc = ['ticket_medio','cpl','cac','roas','conv_grupo'].includes(k);
      const m = calc ? deriv(k, c=>dbg('meta_debrief',c)||0) : dbg('meta_debrief',k);
      const r = calc ? deriv(k, c=>dbg('debriefing',c)||0)   : dbg('debriefing',k);
      const f = v => v==null||!isFinite(v) ? '—'
        : u==='R$' ? brl(v) : u==='%' ? v.toFixed(1)+'%' : u==='x' ? v.toFixed(2)
        : Math.round(v).toLocaleString('pt-BR');
      h += `<tr><td>${lb}</td><td>${f(m)}</td><td class="forte">${f(r)}</td></tr>`;
    });
    h += `</tbody></table>`;
    const PERG = ['O que funcionou melhor na captação?','Qual conteúdo vendeu mais?',
      'A narrativa gerou mesmo a sensação de melhor da história?',
      'O combo tinha bônus que o público queria?','A ancoragem de preço foi bem feita?',
      'O que os disparos trouxeram?','Quais coisas novas foram aplicadas e qual foi o resultado?',
      'O que não repetir na próxima?','O que repetir com certeza?'];
    if (rd.some(x=>x&&x.trim())) {
      h += `<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">`;
      PERG.forEach((q,i) => {
        if (!rd[i] || !rd[i].trim()) return;
        h += `<div class="perg"><div class="q2">${i+1}. ${q}</div>
          <div class="a">${esc(rd[i])}</div></div>`;
      });
      h += `</div>`;
    }
    h += `</div>`;
  }

  h += `<div class="rod">Planejamento do pico, em tempo real.<br>
    Página de leitura. Nada aqui pode ser alterado.</div>`;
  document.getElementById('app').innerHTML = h;
  document.querySelectorAll('.card > h2').forEach(t => {
    t.classList.add('rec');
    t.onclick = () => t.parentElement.classList.toggle('fechado');
  });
}

/* ── Tráfego, só leitura ─────────────────────────────────────────
   Mesma chave do link do pico, dados da função trafego-publico. Vendas,
   CPA e ROAS contados pela Hotmart, igual à aba Tráfego do Tracker. */
const PER_TRF = [['hoje','Hoje'],['3d','3D'],['5d','5D'],['7d','7D'],['maximum','Total']];
const COL_TRF = [
  ['gasto','Gasto','r'],['vendas','Vendas','n'],['cpa','CPA','cpa'],['cpa_mais1','CPA +1','cpa'],
  ['cpc','CPC','r'],['cpm','CPM','r'],['ctr','CTR','p'],['impressoes','Impr.','n'],['hook_rate','Hook%','p'],
  ['lp_views','LP Views','n'],['custo_lp','Custo/LP','r'],['init_check','Init.','n'],['custo_init','Custo/Init','r'],
  ['connect','Connect','p'],['freq','Freq.','f'],['roas','ROAS','x'],
];
let TRF = null, perTrf = '7d', limiteTrf = null;
const fmtR = v => v == null ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
function celTrf(m, [k,,tipo]) {
  if (!m || m[k] == null) return '<td>—</td>';
  const v = m[k];
  if (tipo === 'r') return `<td>${fmtR(v)}</td>`;
  if (tipo === 'cpa') {
    const lim = limiteTrf, cls = lim ? (v <= lim ? 'bom' : 'ruim') : '';
    return `<td class="${cls}">${fmtR(v)}</td>`;
  }
  if (tipo === 'p') return `<td>${(v*100).toFixed(1).replace('.',',')}%</td>`;
  if (tipo === 'f') return `<td>${Number(v).toFixed(1).replace('.',',')}</td>`;
  if (tipo === 'x') return `<td>${String(v).replace('.',',')}x</td>`;
  return `<td>${Number(v).toLocaleString('pt-BR')}</td>`;
}
function linhaTrf(cls, nome, m) {
  return `<tr class="${cls}"><td>${nome}</td>${COL_TRF.map(c => celTrf(m, c)).join('')}</tr>`;
}
function renderTrafego() {
  const alvo = document.getElementById('trafego');
  const quando = TRF.atualizado_em ? new Date(TRF.atualizado_em).toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
  let h = `<div class="topo"><h1>Tráfego</h1><span class="tag">somente leitura</span></div>
    <div class="sub">Anúncios ativos no Meta. Vendas, CPA e ROAS contados pelas vendas aprovadas na Hotmart. Métricas do Meta atualizadas em ${esc(quando)}.</div>
    <div class="per">${PER_TRF.map(([k,l]) => `<button data-per="${k}" class="${k===perTrf?'on':''}">${l}</button>`).join('')}</div>
    <div class="trf"><table><thead><tr><th>Campanha / conjunto / anúncio</th>${COL_TRF.map(c => `<th>${c[1]}</th>`).join('')}</tr></thead><tbody>`;
  for (const c of TRF.campanhas) {
    if (!c.periodos[perTrf]) continue;
    limiteTrf = c.limite;
    h += linhaTrf('camp', esc(c.nome), c.periodos[perTrf]);
    for (const s of c.conjuntos) {
      if (!s.periodos[perTrf]) continue;
      h += linhaTrf('conj', esc(s.nome), s.periodos[perTrf]);
      for (const a of s.anuncios) {
        if (!a.periodos[perTrf]) continue;
        const mini = a.miniatura
          ? `<span class="mini"><img src="${esc(a.miniatura)}" alt="" loading="lazy" onerror="this.remove()">${a.video?'<span class="play">▶</span>':''}</span>`
          : `<span class="mini"></span>`;
        const nome = `<div class="nome-ad">${mini}${a.numero!=null?`<span class="num-ad">${String(a.numero).padStart(3,'0')}</span>`:''}<span class="tit-ad">${esc(a.titulo||'Anúncio sem cadastro')}</span></div>`;
        h += linhaTrf('ad', nome, a.periodos[perTrf]);
      }
    }
  }
  h += `</tbody></table></div><div class="rod">Página de leitura. Nada aqui pode ser alterado.</div>`;
  alvo.innerHTML = h;
  alvo.querySelectorAll('.per button').forEach(b => b.onclick = () => { perTrf = b.dataset.per; renderTrafego(); });
}
async function abrirTrafego(t) {
  const alvo = document.getElementById('trafego');
  if (TRF) return renderTrafego();
  alvo.innerHTML = '<div class="sub">Carregando o tráfego...</div>';
  try {
    const r = await fetch('https://wntzzzuqoqmfcjebmzul.supabase.co/functions/v1/trafego-publico?t=' + encodeURIComponent(t));
    const d = await r.json();
    if (!r.ok) { alvo.innerHTML = '<div class="erro">'+esc(d.erro||'Não foi possível abrir.')+'</div>'; return; }
    TRF = d; renderTrafego();
  } catch (e) { alvo.innerHTML = '<div class="erro">Não foi possível carregar agora.</div>'; }
}
function montarAbas(t) {
  const app = document.getElementById('app');
  const nav = document.createElement('nav');
  nav.className = 'wrap abas';
  nav.innerHTML = '<button data-aba="pico" class="on">Pico de vendas</button><button data-aba="trafego">Tráfego</button>';
  const trf = document.createElement('div');
  trf.className = 'wrap'; trf.id = 'trafego'; trf.hidden = true;
  app.before(nav); app.after(trf);
  const ir = aba => {
    nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.aba === aba));
    app.hidden = aba !== 'pico'; trf.hidden = aba !== 'trafego';
    if (aba === 'trafego') abrirTrafego(t);
    history.replaceState(null, '', aba === 'trafego' ? '#trafego' : location.pathname + location.search);
  };
  nav.querySelectorAll('button').forEach(b => b.onclick = () => ir(b.dataset.aba));
  if (location.hash === '#trafego') ir('trafego');
}

(async () => {
  const t = new URLSearchParams(location.search).get('t');
  const alvo = document.getElementById('app');
  if (!t) { alvo.innerHTML = '<div class="erro">Link incompleto.</div>'; return; }
  try {
    const r = await fetch('https://wntzzzuqoqmfcjebmzul.supabase.co/functions/v1/pico-publico?t=' + encodeURIComponent(t));
    const d = await r.json();
    if (!r.ok) { alvo.innerHTML = '<div class="erro">'+esc(d.erro||'Não foi possível abrir.')+'</div>'; return; }
    document.title = d.projeto.nome;
    render(d);
    montarAbas(t);
  } catch (e) {
    alvo.innerHTML = '<div class="erro">Não foi possível carregar agora.</div>';
  }
})();
</script>
</body>
</html>
