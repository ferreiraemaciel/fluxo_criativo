name = "organico-media"
main = "index.js"
compatibility_date = "2024-01-01"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "site-fmn"

[triggers]
crons = ["*/15 * * * *"]

# Guarda os logs do worker (inclusive os erros do cron de publicação).
# Estava desligado, e por isso a falha de publicação do ORG 039 em 2026-08-09
# não deixou nenhum rastro consultável.
[observability]
enabled = true
head_sampling_rate = 1
